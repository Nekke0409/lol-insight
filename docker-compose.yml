services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lol_insight}
      POSTGRES_USER: ${POSTGRES_USER:-lol_insight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lol-insight-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
