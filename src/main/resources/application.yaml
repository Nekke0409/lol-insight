spring:
  application:
    name: lol-insight
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
  paths-to-match: /api/v1/**

# 실제 Riot API 연동을 추가할 때 환경변수로 주입한다.
# API 키는 이 파일이나 Git에 저장하지 않는다.
riot:
  api:
    key: ${RIOT_API_KEY:}
    platform-base-url: ${RIOT_PLATFORM_BASE_URL:https://kr.api.riotgames.com}
    regional-base-url: ${RIOT_REGIONAL_BASE_URL:https://asia.api.riotgames.com}
    connect-timeout: ${RIOT_CONNECT_TIMEOUT:2s}
    read-timeout: ${RIOT_READ_TIMEOUT:5s}
    # 429에 Retry-After가 없거나 유효하지 않을 때의 JVM-local cooldown 보수값이다.
    cooldown-fallback: ${RIOT_COOLDOWN_FALLBACK:60s}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5-mini}
  timeout: ${OPENAI_TIMEOUT:60s}
  reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
  text-verbosity: ${OPENAI_TEXT_VERBOSITY:low}

agent:
  # 기본값은 false다. 개인 local 검증에서만 명시적으로 활성화한다.
  enabled: ${AGENT_ENABLED:false}
  model-request-timeout: ${AGENT_MODEL_REQUEST_TIMEOUT:30s}
  execution-deadline: ${AGENT_EXECUTION_DEADLINE:60s}
  max-model-requests: ${AGENT_MAX_MODEL_REQUESTS:3}
  max-tool-executions: ${AGENT_MAX_TOOL_EXECUTIONS:2}
  max-question-characters: ${AGENT_MAX_QUESTION_CHARACTERS:1000}
  max-tool-result-characters: ${AGENT_MAX_TOOL_RESULT_CHARACTERS:12000}
  max-output-tokens: ${AGENT_MAX_OUTPUT_TOKENS:600}
  smoke-observation:
    # 로컬 smoke에서만 허용된 Tool과 식별정보 없는 통계 요약을 기록한다.
    enabled: ${AGENT_SMOKE_OBSERVATION_ENABLED:false}

analysis:
  result-cache:
    ttl: ${ANALYSIS_RESULT_CACHE_TTL:30m}
    version: ${ANALYSIS_RESULT_CACHE_VERSION:analysis-result-v3}
  rate-limit:
    capacity: ${ANALYSIS_RATE_LIMIT_CAPACITY:3}
    window: ${ANALYSIS_RATE_LIMIT_WINDOW:1m}
  jobs:
    dedupe:
      expiry: ${ANALYSIS_JOB_DEDUPE_EXPIRY:5m}
    executor:
      worker-threads: ${ANALYSIS_JOB_WORKER_THREADS:1}
      queue-capacity: ${ANALYSIS_JOB_QUEUE_CAPACITY:2}
  automation:
    # 기본값은 false다. 명시적으로 켜기 전에는 Riot/OpenAI 비용을 발생시키지 않는다.
    enabled: ${ANALYSIS_AUTOMATION_ENABLED:false}
    poll-interval: ${ANALYSIS_AUTOMATION_POLL_INTERVAL:30m}
    batch-size: ${ANALYSIS_AUTOMATION_BATCH_SIZE:10}
    # 로컬에서만 opt-in으로 Riot ID를 초기 등록할 수 있다. 형식: gameName#tagLine,gameName#tagLine
    bootstrap:
      enabled: ${ANALYSIS_AUTOMATION_BOOTSTRAP_ENABLED:false}
      players: ${ANALYSIS_AUTOMATION_BOOTSTRAP_PLAYERS:}

benchmark:
  sample:
    # gameStartTimestamp 기준 rolling validity window다. 저장 retention과 별개다.
    max-age: ${BENCHMARK_SAMPLE_MAX_AGE:30d}
  replenishment:
    # enabled는 scheduler만 제어한다. run-once는 아래의 별도 opt-in이며 enabled=false여도 1회 실행할 수 있다.
    enabled: ${BENCHMARK_REPLENISHMENT_ENABLED:false}
    interval: ${BENCHMARK_REPLENISHMENT_INTERVAL:24h}
    max-cohorts-per-tick: ${BENCHMARK_REPLENISHMENT_MAX_COHORTS_PER_TICK:1}
    page-count-per-cohort: ${BENCHMARK_REPLENISHMENT_PAGE_COUNT_PER_COHORT:1}
    player-limit-per-cohort: ${BENCHMARK_REPLENISHMENT_PLAYER_LIMIT_PER_COHORT:10}
    matches-per-player: ${BENCHMARK_REPLENISHMENT_MATCHES_PER_PLAYER:5}
    # 형식: GOLD:I,PLATINUM:I. 현재 검증된 League-V4 discovery 범위만 허용한다.
    cohorts: ${BENCHMARK_REPLENISHMENT_COHORTS:GOLD:I}
    # startup one-tick runner의 별도 opt-in이다. 기본값은 false다.
    run-once: ${RUN_BENCHMARK_REPLENISHMENT_ONCE:false}
