name: lol-insight-deploy

services:
  app:
    image: ${DEPLOY_APP_IMAGE:?Set DEPLOY_APP_IMAGE in deploy.env to a versioned application image tag.}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: deploy
      SERVER_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy.env.}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy.env.}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy.secrets.env.}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RIOT_API_KEY: ${RIOT_API_KEY:?Set RIOT_API_KEY in deploy.secrets.env.}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in deploy.secrets.env.}
      ANALYSIS_AUTOMATION_ENABLED: "false"
      ANALYSIS_AUTOMATION_BOOTSTRAP_ENABLED: "false"
      ANALYSIS_AUTOMATION_BOOTSTRAP_PLAYERS: ""
      BENCHMARK_REPLENISHMENT_ENABLED: "false"
      RUN_BENCHMARK_REPLENISHMENT_ONCE: "false"
    ports:
      - "127.0.0.1:${APP_HOST_PORT:?Set APP_HOST_PORT in deploy.env.}:8080"
    restart: unless-stopped
    stop_grace_period: 45s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy.env.}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy.env.}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy.secrets.env.}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
    name: lol-insight-deploy-postgres-data
